<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المنتج | Forto Store</title>
    <link rel="icon" href="images/logo.png" type="image/png">
    <link rel="apple-touch-icon" href="images/logo.png">

    <!-- Open Graph / Meta -->
    <meta property="og:title" content="متجر فورتو | Forto Store">
    <meta property="og:image" content="https://fortostore.com/images/logo.png">
    <meta property="twitter:image" content="https://fortostore.com/images/logo.png">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Cairo:wght@400;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/detail.css">
    <link rel="stylesheet" href="css/toast.css">
</head>

<body class="rtl">
    <div class="scroll-progress"></div>
    <header>
        <div class="container">
            <nav>
                <a href="/" class="logo">
                    <img src="images/logo.png" alt="FORTO STORE" style="height: 95px; width: auto;">
                </a>
                <ul class="nav-links">
                    <li><a href="/" data-i18n="home">الرئيسية</a></li>
                    <li><a href="products" data-i18n="shop">المتجر</a></li>
                    <li id="auth-link"><a href="login" data-i18n="login">دخول</a></li>
                </ul>
                <div class="nav-icons">
                    <a href="cart" class="cart-icon">
                        <i class="fas fa-shopping-bag"></i>
                        <span class="cart-count">0</span>
                    </a>
                </div>
            </nav>
        </div>
    </header>

    <main class="container" style="margin-top: 85px;">
        <div class="product-detail-layout" id="product-detail">
            <!-- Injected via JS -->
            <div class="detail-image skeleton"></div>
            <div class="detail-info skeleton"></div>
        </div>

        <!-- Related Products Section -->
        <section class="container" style="margin-top: 5rem; padding-top: 3rem; border-top: 1px solid #eee;">
            <div class="reveal">
                <h2 style="margin-bottom: 2rem; border-right: 4px solid var(--color-blue); padding-right: 15px;"
                    data-i18n="related_products">منتجات قد تعجبك</h2>
            </div>
            <div class="featured-grid" id="related-products-grid">
                <!-- Injected via JS -->
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="footer-content">
                <div>
                    <h3>FORTO STORE</h3>
                    <p style="margin-top: 20px; color: #888;" data-i18n="premium_exp">تجربة تسوق فاخرة.</p>
                    <div class="social-links" style="margin-top: 20px; display: flex; gap: 15px;">
                        <a href="https://www.facebook.com/fortostore/" target="_blank"
                            style="color: #888; font-size: 1.5rem;"><i class="fab fa-facebook"></i></a>
                        <a href="https://www.instagram.com/fortostore/" target="_blank"
                            style="color: #888; font-size: 1.5rem;"><i class="fab fa-instagram"></i></a>
                    </div>
                </div>
                <div>
                    <h4 data-i18n="links">روابط</h4>
                    <ul style="list-style: none; margin-top: 20px; line-height: 2;">
                        <li><a href="/" data-i18n="home">الرئيسية</a></li>
                        <li><a href="products" data-i18n="shop">المتجر</a></li>
                        <li><a href="cart" data-i18n="cart_title">السلة</a></li>
                    </ul>
                </div>
                <div>
                    <h4 data-i18n="contact">تواصل معنا</h4>
                    <p style="margin-top: 20px; color: #888;">forto0224@gmail.com</p>
                    <p style="color: #888;">+20 112 565 5690</p>
                </div>
            </div>
            <div
                style="margin-top: 4rem; border-top: 1px solid #333; padding-top: 2rem; text-align: center; color: #666;">
                &copy; 2026 Forto Store. All rights reserved.
            </div>
        </div>
    </footer>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="js/firebase-config.js"></script>

    <script src="js/data.js"></script>
    <script src="js/translations.js"></script>
    <script src="js/main.js"></script>
    <script>
        let selectedColor = null;
        let selectedSize = null;

        function updateMetaTag(property, content) {
            let meta = document.querySelector(`meta[property="${property}"]`);
            if (!meta) {
                meta = document.querySelector(`meta[name="${property}"]`);
            }
            if (meta) {
                meta.setAttribute('content', content);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');
            const product = db.getProduct(productId);

            // SEO Logic
            if (product) {
                const storeName = "Forto Store | متجر فورتو";
                const pageTitle = `${product.name} - ${storeName}`;
                document.title = pageTitle;

                // Update Meta Tags for Social Sharing
                updateMetaTag('og:title', pageTitle);
                updateMetaTag('og:description', product.description.substring(0, 160));
                updateMetaTag('og:image', product.image);
                updateMetaTag('twitter:title', pageTitle);
                updateMetaTag('twitter:description', product.description.substring(0, 160));
                updateMetaTag('twitter:image', product.image);

                // Inject Structured Data (Product Schema)
                const schema = {
                    "@context": "https://schema.org/",
                    "@type": "Product",
                    "name": product.name,
                    "image": [product.image, ...(product.images || [])],
                    "description": product.description,
                    "sku": `FORTO-${product.id}`,
                    "brand": {
                        "@type": "Brand",
                        "name": "Forto"
                    },
                    "offers": {
                        "@type": "Offer",
                        "url": window.location.href,
                        "priceCurrency": "EGP",
                        "price": product.price,
                        "availability": "https://schema.org/InStock",
                        "itemCondition": "https://schema.org/NewCondition"
                    }
                };
                const script = document.createElement('script');
                script.type = 'application/ld+json';
                script.text = JSON.stringify(schema);
                document.head.appendChild(script);
            }

            // Track ViewContent Event
            if (product && typeof trackEvent === 'function') {
                trackEvent('ViewContent', {
                    content_name: product.name,
                    content_ids: [product.id],
                    content_type: 'product',
                    value: product.price,
                    currency: 'EGP'
                });
            }
            const container = document.getElementById('product-detail');
            const lang = localStorage.getItem('forto_lang') || 'ar';
            const t = translations[lang] || translations['ar'];

            if (!product) {
                container.innerHTML = `<h2 data-i18n="product_not_found">${t.product_not_found}</h2>`;
                return;
            }

            // Variants Logic
            const colors = Array.isArray(product.color) ? product.color : (product.color ? product.color.split(',').map(c => c.trim()) : []);
            const sizes = Array.isArray(product.size) ? product.size : (product.size ? product.size.split(',').map(s => s.trim()) : []);

            // Restore pending selections from localStorage
            const pendingParams = localStorage.getItem('pending_product_options');
            if (pendingParams) {
                const data = JSON.parse(pendingParams);
                if (data.id == productId) {
                    selectedColor = data.color;
                    selectedSize = data.size;

                    // If now logged in, auto-buy and proceed to checkout for a seamless experience
                    if (db.isCustomerLoggedIn()) {
                        localStorage.removeItem('pending_product_options');
                        db.addToCart(product, selectedColor, selectedSize);
                        window.location.href = 'checkout';
                        return;
                    }
                }
                localStorage.removeItem('pending_product_options');
            }

            let colorsHTML = '';
            if (colors.length > 0) {
                colorsHTML = `
                    <div class="variant-selector">
                        <label>${t.color}</label>
                        <div class="variant-options">
                            ${colors.map(c => `<div class="color-option ${selectedColor === c ? 'selected' : ''}" onclick="selectColor('${c}', this)">${c}</div>`).join('')}
                        </div>
                    </div>
                `;
            }

            let sizesHTML = '';
            if (sizes.length > 0) {
                sizesHTML = `
                    <div class="variant-selector">
                        <label>${t.size}</label>
                        <div class="variant-options">
                            ${sizes.map(s => `<div class="size-option ${selectedSize === s ? 'selected' : ''}" onclick="selectSize('${s}', this)">${s}</div>`).join('')}
                        </div>
                    </div>
                `;
            }

            const images = product.images || [product.image];
            const thumbsHTML = images.map((img, idx) => `
                <img src="${img}" class="thumb ${idx === 0 ? 'active' : ''}" onclick="changeMainImage('${img}', this)" alt="${product.name} - ${idx + 1}">
            `).join('');

            container.innerHTML = `
                <div class="reveal">
                    <div class="detail-image" style="height: 450px;">
                        <img src="${images[0]}" alt="${product.name}" id="main-img" onmousemove="zoom(event)">
                    </div>
                    <div class="thumbnail-gallery">
                        ${thumbsHTML}
                    </div>
                </div>
                <div class="detail-info reveal delay-200">
                    <h1 style="font-size: 2rem;">${product.name}</h1>
                    <span class="detail-price" style="color: var(--color-blue); font-weight: bold; margin-bottom: 1.5rem;">
                        ${product.oldPrice ? `<span style="text-decoration: line-through; color: #999; font-size: 1rem; margin-left: 10px;">${product.oldPrice} ${t.currency}</span>` : ''}
                        ${product.price} <span data-i18n="currency">${t.currency}</span>
                    </span>
                    
                    <div style="margin-bottom: 1.5rem;">${colorsHTML}</div>
                    <div style="margin-bottom: 1.5rem;">${sizesHTML}</div>

                    <p class="detail-desc" style="margin-bottom: 1.5rem; line-height: 1.6;">${product.description}</p>
                    
                    <div class="action-buttons" style="flex-wrap: wrap; gap: 0.8rem; margin-top: 1.5rem;">
                        <button class="btn btn-primary" onclick="addToCartClick(${product.id})">
                            <i class="fas fa-shopping-cart" style="margin-right: 10px;"></i> <span data-i18n="add_to_cart">${t.add_to_cart}</span>
                        </button>
                        <button class="btn btn-primary" onclick="buyNowClick(${product.id})" style="background-color: var(--color-blue); border-color: var(--color-blue);">
                             <i class="fas fa-bolt" style="margin-right: 10px;"></i> <span data-i18n="buy_now">${t.buy_now}</span>
                        </button>
                    </div>
                </div>
            `;
            renderRelatedProducts(productId);
            initScrollAnimations();
        });

        function selectColor(color, el) {
            selectedColor = color;
            document.querySelectorAll('.color-option').forEach(opt => opt.classList.remove('selected'));
            el.classList.add('selected');
        }

        function selectSize(size, el) {
            selectedSize = size;
            document.querySelectorAll('.size-option').forEach(opt => opt.classList.remove('selected'));
            el.classList.add('selected');
        }

        function addToCartClick(id) {
            const product = db.getProduct(id);
            const lang = localStorage.getItem('forto_lang') || 'ar';
            const t = translations[lang] || translations['ar'];

            // Validation
            const colors = Array.isArray(product.color) ? product.color : (product.color ? product.color.split(',').map(c => c.trim()) : []);
            const sizes = Array.isArray(product.size) ? product.size : (product.size ? product.size.split(',').map(s => s.trim()) : []);

            if (colors.length > 0 && !selectedColor) {
                showToast(lang === 'ar' ? 'من فضلك اختر اللون' : 'Please select a color', 'error');
                return;
            }
            if (sizes.length > 0 && !selectedSize) {
                showToast(lang === 'ar' ? 'من فضلك اختر المقاس' : 'Please select a size', 'error');
                return;
            }

            db.addToCart(product, selectedColor, selectedSize);

            // Track AddToCart Event
            if (typeof trackEvent === 'function') {
                trackEvent('AddToCart', {
                    content_name: product.name,
                    content_ids: [product.id],
                    content_type: 'product',
                    value: product.price,
                    currency: 'EGP'
                });
            }

            // Visual feedback
            const btn = event.currentTarget;
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `< i class="fas fa-check" ></i > <span data-i18n="added">${t.added}</span>`;
            btn.style.background = '#28a745';
            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.style.background = '';
            }, 2000);
        }

        function buyNowClick(id) {
            const lang = localStorage.getItem('forto_lang') || 'ar';

            // 1. Check Login First
            if (!db.isCustomerLoggedIn()) {
                const msg = lang === 'ar' ? 'يجب تسجيل الدخول لإتمام عملية الشراء. هل تريد تسجيل الدخول الآن؟' : 'You must be logged in to proceed. Do you want to login now?';

                // Save selected options to restore after login
                localStorage.setItem('pending_product_options', JSON.stringify({
                    id: id,
                    color: selectedColor,
                    size: selectedSize
                }));

                showConfirm(msg, () => {
                    // Redirect to login with proper return url
                    window.location.href = `login?redirect=product?id=${id}`;
                });
                return;
            }

            const product = db.getProduct(id);
            const t = translations[lang] || translations['ar'];

            const colors = Array.isArray(product.color) ? product.color : (product.color ? product.color.split(',').map(c => c.trim()) : []);
            const sizes = Array.isArray(product.size) ? product.size : (product.size ? product.size.split(',').map(s => s.trim()) : []);

            if (colors.length > 0 && !selectedColor) {
                showToast(lang === 'ar' ? 'من فضلك اختر اللون' : 'Please select a color', 'error');
                return;
            }
            if (sizes.length > 0 && !selectedSize) {
                showToast(lang === 'ar' ? 'من فضلك اختر المقاس' : 'Please select a size', 'error');
                return;
            }

            db.addToCart(product, selectedColor, selectedSize);
            window.location.href = 'checkout';
        }

        function changeMainImage(src, el) {
            document.getElementById('main-img').src = src;
            document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
        }

        function zoom(e) { }

        function renderRelatedProducts(currentId) {
            const allProducts = db.getProducts();
            const lang = localStorage.getItem('forto_lang') || 'ar';
            const currency = translations[lang]['currency'];
            const btnText = translations[lang]['view_details'];

            // Filter out current product
            let related = allProducts.filter(p => p.id != currentId);

            // Shuffle array
            related.sort(() => 0.5 - Math.random());

            // Take first 4
            related = related.slice(0, 4);

            const container = document.getElementById('related-products-grid');
            if (!container) return;

            if (related.length === 0) {
                container.innerHTML = '<p style="text-align:center; width:100%; color:#888;">No suggested products found.</p>';
                return;
            }

            container.innerHTML = '';
            related.forEach((p, index) => {
                const card = document.createElement('div');
                card.className = 'product-card reveal';
                card.style.transitionDelay = `${index * 0.1}s`;
                card.onclick = () => window.location.href = `product?id=${p.id}`;

                // Calculate discount for display if needed (simplified here)
                let priceHtml = ``;
                if (p.oldPrice) {
                    priceHtml = `<span style="text-decoration: line-through; color: #999; font-size: 0.9rem; margin-left: 5px;">${p.oldPrice} ${currency}</span> ${p.price} ${currency}`;
                } else {
                    priceHtml = `${p.price} ${currency}`;
                }

                card.innerHTML = `
                    <div class="product-img">
                        <img src="${p.image}" alt="${p.name}">
                    </div>
                    <div class="product-info">
                        <h3>${p.name}</h3>
                        <p style="color: var(--color-blue); font-weight: bold; margin-top: 5px;">
                            ${priceHtml}
                        </p>
                        <div class="btn btn-secondary" style="margin-top: 15px; width: 100%;">${btnText}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>

<script src="js/pixel.js"></script>
</body>

</html>
