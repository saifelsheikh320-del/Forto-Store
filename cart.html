<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>السلة | Forto Store</title>
    <link rel="icon" href="images/logo-v2.png" type="image/png">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Cairo:wght@400;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <style>
        .cart-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
            margin-top: 2rem;
        }

        @media (max-width: 768px) {
            .cart-layout {
                grid-template-columns: 1fr;
            }
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        th {
            background: #f5f5f5;
            padding: 1rem;
            text-align: left;
            font-weight: 600;
        }

        body.rtl th {
            text-align: right;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid #eee;
        }

        .cart-summary {
            background: #f9f9f9;
            padding: 2rem;
            border-radius: 8px;
            height: fit-content;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .total-row {
            font-weight: 800;
            font-size: 1.5rem;
            border-top: 2px solid #ddd;
            padding-top: 1rem;
            margin-top: 1rem;
        }
    </style>
</head>

<body class="rtl">
    <div class="scroll-progress"></div>
    <header>
        <div class="container">
            <nav>
                <a href="/" class="logo">
                    <img src="images/logo-v2.png" alt="FORTO STORE" style="height: 95px; width: auto;">
                </a>
                <ul class="nav-links">
                    <li><a href="/" data-i18n="home">الرئيسية</a></li>
                    <li><a href="products" data-i18n="shop">المتجر</a></li>
                    <li id="auth-link"><a href="login" data-i18n="login">دخول</a></li>
                </ul>
                <div class="nav-icons">
                    <a href="cart" class="cart-icon">
                        <i class="fas fa-shopping-bag"></i>
                        <span class="cart-count">0</span>
                    </a>
                </div>
            </nav>
        </div>
    </header>

    <div class="page-header reveal">
        <div class="container">
            <h1 data-i18n="cart_title">حقيبة التسوق</h1>
        </div>
    </div>

    <main class="container reveal delay-100"
        style="padding-top: 2rem; padding-bottom: 4rem; padding-left: 15px; padding-right: 15px;">
        <div class="cart-layout">
            <div class="cart-items">
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th data-i18n="product_col">المنتج</th>
                            <th data-i18n="price_col">السعر</th>
                            <th data-i18n="qty_col">الكمية</th>
                            <th data-i18n="total_col">المجموع</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="cart-items">
                        <!-- JS Rendered -->
                    </tbody>
                </table>
            </div>

            <div class="cart-summary reveal delay-200">
                <h2 data-i18n="summary">الملخص</h2>
                <div style="margin: 20px 0;">
                    <div class="summary-row">
                        <span data-i18n="subtotal">المجموع الفرعي</span>
                        <span id="cart-total">$0</span>
                    </div>
                </div>
                <div class="summary-row total-row">
                    <span data-i18n="total">الإجمالي</span>
                    <span id="final-total">$0</span>
                </div>
                <a href="checkout" class="btn btn-primary" style="width: 100%; margin-top: 20px;"
                    data-i18n="proceed_checkout">إتمام الشراء</a>
            </div>
        </div>
    </main>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="js/firebase-config.js"></script>

    <script src="js/data.js"></script>
    <script src="js/translations.js"></script>
    <script src="js/main.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/pixel.js"></script>
</body>

</html>
